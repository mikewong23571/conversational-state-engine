repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: uv run end-of-file-fixer
        language: system
        types: [text]

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: uv run ruff
        language: system
        types: [python]
        args: ["--fix", "--exit-non-zero-on-fix"]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["server", "domains", "shared"]

      - id: eslint
        name: eslint
        entry: uv run eslint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: "^web/"
        args: ["--config", "web/eslint.config.js"]
