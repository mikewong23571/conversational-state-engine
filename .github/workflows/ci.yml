name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  # Fast unit tests - run on every commit
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set PyPI index to default
        run: echo "PIP_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: make test-unit

      - name: Generate coverage report
        if: github.event_name == 'pull_request'
        run: make test-coverage

      - name: Upload coverage to GitHub
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # E2E tests - run on PRs and main branch
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set PyPI index to default
        run: echo "PIP_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV

      - name: Install dependencies
        run: uv sync --dev

      - name: Run E2E tests
        run: make test-e2e

  # Linting and code quality
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set PyPI index to default
        run: echo "PIP_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node dependencies
        run: pnpm install
      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy server/ domains/ shared/

      - name: Install pre-commit
        run: |
          uv add pre-commit
          uv run pre-commit install-hooks

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Lint and type check frontend
        run: |
          cd web
          pnpm run lint
          pnpm run type-check

  # Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set PyPI index to default
        run: echo "PIP_INDEX_URL=https://pypi.org/simple" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          uv sync --dev
          pnpm install

      - name: Build backend
        run: |
          # Verify backend can start
          timeout 10s uv run uvicorn server.app:app --host 127.0.0.1 --port 8000 || true

      - name: Build frontend
        run: |
          cd web
          pnpm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            web/dist/
            server/

  # Summary job that depends on all others
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Code quality: ${{ needs.code-quality.result }}"
          echo "Build: ${{ needs.build.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Code quality checks failed"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build verification failed"
            exit 1
          fi

          echo "✅ All CI checks passed!"

  # Optional: E2E success check (only runs when e2e-tests runs)
  e2e-success:
    name: E2E Success
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: always() && needs.e2e-tests.result != 'skipped'
    steps:
      - name: Check E2E results
        run: |
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          echo "✅ E2E tests passed!"
